<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>NEXUS SRE DASHBOARD</title>

<style>

body {
    background:#101010;
    color:#eee;
    font-family:Arial;
    padding:20px;
}

h1 {
    color:#00ff99;
}

.container {
    max-width:900px;
    margin:auto;
}

.resposta {
    background:#181818;
    border:1px solid #333;
    border-radius:10px;
    padding:20px;
    min-height:200px;
    white-space:pre-wrap;
    overflow:auto;
}

button {
    margin-top:15px;
    padding:12px 20px;
    border:0;
    border-radius:8px;
    background:#00aa66;
    color:white;
    font-size:16px;
}

button:hover {
    background:#00cc77;
}

input {
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #333;
    background:#222;
    color:white;
}



body.tema-claro{
background:#f5f5f5;
color:#222;
}

body.tema-claro input{
background:#fff;
color:#222;
border:1px solid #bbb;
}

body.tema-claro button{
background:#1976d2;
color:#fff;
}

body.tema-claro .resposta{
background:#fff;
color:#111;
border:1px solid #ccc;
}


</style>

</head>

<body>

<div class="container">

<h1> NEXUS SRE</h1>

<input id="pergunta"
placeholder="Digite uma pergunta para o Nexus">

<button id="btnExecutar" onclick="enviar()">
Executar
</button>

<button id="btnAprender" onclick="aprenderTema()">
🧠 Aprender
</button>

<a
    id="btnVerPaginas"
    href="https://nexus-termux.onrender.com/html_gerados/?utm_source=chatgpt.com"
    target="_blank"
    rel="noopener noreferrer"
    style="
        display:inline-block;
        margin:6px;
        padding:10px 14px;
        background:#16a34a;
        color:#ffffff;
        border:1px solid #22c55e;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        cursor:pointer;
    "
>
    🟢 Ver Páginas
</a>

<button
    id="btnExecutarScript"
    onclick="abrirExecutorScript()"
    style="
        display:inline-block;
        margin:6px;
        padding:10px 14px;
        background:#2563eb;
        color:#ffffff;
        border:1px solid #3b82f6;
        border-radius:6px;
        font-weight:bold;
        cursor:pointer;
    "
>
    🤖 Editar HTML com Gemini
</button>

<div id="executorScript"
     style="
        display:none;
        margin:6px;
        padding:12px;
        border:1px solid #2563eb;
        border-radius:6px;
        background:#0f172a;
     ">

    <input
        id="nomeFerramenta"
        type="text"
        value="editar_html" readonly
        style="
            padding:10px;
            width:60%;
            background:#020617;
            color:white;
            border:1px solid #3b82f6;
            border-radius:5px;
        "
    >


    <br><br>

    <input
        id="nomeHtmlEditar"
        type="text"
        placeholder="Nome do HTML"
        style="
            padding:10px;
            width:95%;
            background:#020617;
            color:white;
            border:1px solid #3b82f6;
            border-radius:5px;
            margin-bottom:8px;
        "
    >

    <textarea
        id="alteracaoHtml"
        placeholder="Descreva a alteração desejada..."
        rows="5"
        style="
            padding:10px;
            width:95%;
            background:#020617;
            color:white;
            border:1px solid #3b82f6;
            border-radius:5px;
            margin-bottom:8px;
        "
    ></textarea>

    <button
        onclick="executarScriptDireto()"
        style="
            padding:10px 14px;
            background:#2563eb;
            color:white;
            border:1px solid #3b82f6;
            border-radius:5px;
            font-weight:bold;
            cursor:pointer;
        "
    >
        EXECUTAR
    </button>

    <button
        onclick="fecharExecutorScript()"
        style="
            padding:10px 14px;
            background:#475569;
            color:white;
            border:1px solid #64748b;
            border-radius:5px;
            cursor:pointer;
        "
    >
        FECHAR
    </button>

    <div id="resultadoScript"
         style="
            margin-top:10px;
            white-space:pre-wrap;
            font-family:monospace;
            color:#00f3ff;
         ">
    </div>
</div>

<h3>Resposta:</h3>

<div id="resposta" class="resposta"
style="white-space:pre-wrap;
overflow-y:auto;
max-height:420px;
font-family:monospace;">
🖥️ NEXUS TERMINAL

Pronto.
</div>

<button id="btnCopiar" onclick="copiarInteligente()">
📋 Copiar resposta
</button>

<button id="btnSalvarTXT" onclick="salvarTXT()">
💾 Salvar TXT
</button>

<button id="btnCompartilhar" onclick="compartilharResposta()">
📤 Compartilhar
</button>

<button id="btnLimpar" onclick="limparResposta()">
 Limpar
</button>

<button id="btnTema" onclick="alternarTema()">
☀️ Tema Claro
</button>




<h3> Histórico</h3>

<div id="historico"
style="
background:#111;
padding:10px;
border-radius:8px;
margin-top:10px;
max-height:220px;
overflow:auto;
font-size:14px;
">
Nenhuma consulta.
</div>

<button id="btnLimparHistorico"
onclick="limparHistorico()">
🗑️ Limpar Histórico
</button>


</div>

<script>


async function enviar(){

const texto =
document.getElementById("pergunta").value.trim();

if(!texto){
    alert("Digite uma pergunta.");
    return;
}

const area =
document.getElementById("resposta");

const botao =
document.getElementById("btnExecutar");

botao.disabled = true;
botao.innerText = "⏳ Executando...";

area.innerText +=

"\n\n────────────────────────────\n"+
"$ "+texto+
"\n"+
"⏳ Processando...\n";

try{

const r =
await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
texto:texto
})
});

const dados =
await r.json();

let resultado="";

if(dados.shell && dados.shell.output){
    resultado=dados.shell.output;
}

area.innerText +=

"\n"+
(dados.nexus||"")+

(resultado
? "\n\n"+resultado
: "")+

"\n";

area.scrollTop =
area.scrollHeight;

botao.innerText="✅ Concluído";

}catch(e){

area.innerText +=

"\n❌ ERRO\n"+e.message+"\n";

area.scrollTop =
area.scrollHeight;

botao.innerText="❌ Erro";

}

setTimeout(()=>{

botao.disabled=false;
botao.innerText="Executar";

},1500);

}


async function copiar(){

const texto =
document.getElementById("resposta").innerText;


await navigator.clipboard.writeText(texto);


alert("Resposta copiada!");

}


async function copiarInteligente(){

    const area =
        document.getElementById("resposta");

    let texto = area.innerText;

    if (texto.includes("📄 RESULTADO:")) {

        texto =
        texto.split("📄 RESULTADO:")[1]
        .trim();

    }

    if (!texto) {

        alert("Nenhuma resposta para copiar.");
        return;

    }

    try {

        await navigator.clipboard.writeText(texto);

        const botao =
        document.getElementById("btnCopiar");

        botao.innerText = "✅ Copiado";

        setTimeout(() => {

            botao.innerText =
            "📋 Copiar resposta";

        }, 2000);

    } catch(e) {

        alert(
        "Erro ao copiar: " + e.message
        );

    }

}



function salvarTXT(){

    const area =
        document.getElementById("resposta");

    let texto = area.innerText;


    if (texto.includes("📄 RESULTADO:")) {

        texto =
        texto.split("📄 RESULTADO:")[1]
        .trim();

    }


    if (!texto){

        alert("Nenhuma resposta para salvar.");
        return;

    }


    const blob =
        new Blob(
            [texto],
            {
                type:
                "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "nexus_resposta.txt";


    link.click();


    URL.revokeObjectURL(url);


    const botao =
    document.getElementById("btnSalvarTXT");


    if(botao){

        botao.innerText =
        "✅ Salvo";

        setTimeout(()=>{

            botao.innerText =
            "💾 Salvar TXT";

        },2000);

    }

}




async function compartilharResposta(){

    const texto =
        document.getElementById("resposta").innerText;

    if(!texto.trim()){
        alert("Nenhuma resposta para compartilhar.");
        return;
    }

    if(navigator.share){

        try{

            await navigator.share({
                title:"Nexus SRE",
                text:texto
            });

        }catch(e){}

    }else{

        alert("Seu navegador não suporta compartilhamento.");

    }

}

function limparResposta(){

    document.getElementById("pergunta").value="";

    document.getElementById("resposta").innerText=
    "Aguardando comando...";

}



function alternarTema(){

    const body =
        document.body;

    body.classList.toggle(
        "tema-claro"
    );

    const claro =
        body.classList.contains(
            "tema-claro"
        );

    localStorage.setItem(
        "tema",
        claro ? "claro" : "escuro"
    );

    const btn =
        document.getElementById(
            "btnTema"
        );

    if(btn){

        btn.innerText =
            claro
            ? "🌙 Tema Escuro"
            : "☀️ Tema Claro";

    }

}

window.addEventListener(
"load",
()=>{

    if(
        localStorage.getItem("tema")
        ===
        "claro"
    ){

        document.body.classList.add(
            "tema-claro"
        );

        const btn =
            document.getElementById(
                "btnTema"
            );

        if(btn){

            btn.innerText =
            "🌙 Tema Escuro";

        }

    }

});




let historico = [];

async function carregarHistorico() {
    const div = document.getElementById("historico");

    if (!div) return;

    try {
        const resposta = await fetch("/api/historico");
        const dados = await resposta.json();

        if (!dados.success) {
            div.innerHTML = "Erro ao carregar histórico.";
            return;
        }

        historico = dados.historico || [];

        renderHistorico();

    } catch (erro) {
        console.error("Erro ao carregar histórico:", erro);
        div.innerHTML = "Erro ao carregar histórico.";
    }
}

function renderHistorico() {
    const div = document.getElementById("historico");

    if (!div) return;

    if (historico.length === 0) {
        div.innerHTML = "Nenhuma consulta.";
        return;
    }

    div.innerHTML = "";

    historico.forEach((item) => {
        const linha = document.createElement("div");

        linha.style.cursor = "pointer";
        linha.style.padding = "8px";
        linha.style.borderBottom = "1px solid #333";

        const data = item.timestamp
            ? new Date(item.timestamp).toLocaleString()
            : "";

        linha.innerHTML =
            "<b>" + data + "</b><br>" +
            "🧑 " + (item.entrada || "") + "<br>" +
            "⚙️ " + (item.acao || "");

        linha.onclick = () => {
            document.getElementById("pergunta").value =
                item.entrada || "";
        };

        div.appendChild(linha);
    });
}

function limparHistorico() {
    historico = [];
    renderHistorico();
}

window.addEventListener("load", carregarHistorico);

document.getElementById("pergunta")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

e.preventDefault();

enviar();

}

});




async function aprenderTema(){

    const tema =
        document.getElementById("pergunta").value.trim();

    if(!tema){

        alert("Digite um tema para aprender.");

        return;

    }

    const area =
        document.getElementById("resposta");

    const botao =
        document.getElementById("btnAprender");

    botao.disabled = true;
    botao.innerText = "⏳ Aprendendo...";

    area.innerText +=
        "\n\n────────────────────────────\n" +
        "🧠 Aprendendo: " + tema + "\n";

    try{

        const r =
            await fetch("/api/aprender",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    tema:tema
                })
            });

        const dados =
            await r.json();

        if(dados.success){

            area.innerText +=
                "\n✅ Conhecimento salvo com sucesso.\n\n";

            if(dados.output){

                area.innerText +=
                    dados.output + "\n";

            }

        }else{

            area.innerText +=
                "\n❌ " +
                (dados.erro || "Falha ao aprender.") +
                "\n";

        }

    }catch(e){

        area.innerText +=
            "\n❌ " +
            e.message +
            "\n";

    }

    area.scrollTop =
        area.scrollHeight;

    botao.disabled = false;
    botao.innerText = "🧠 Aprender";

}


</script>



<script>
function abrirExecutorScript() {
    const painel = document.getElementById("executorScript");
    const campo = document.getElementById("nomeFerramenta");

    painel.style.display = "block";
    campo.focus();
}

function fecharExecutorScript() {
    document.getElementById("executorScript").style.display = "none";
}

async function executarScriptDireto() {

    const resultado = document.getElementById("resultadoScript");

    const ferramenta = "editar_html";
    const html = document.getElementById("nomeHtmlEditar").value.trim();
    const alteracao = document.getElementById("alteracaoHtml").value.trim();

    if (!html) {
        resultado.textContent = "❌ Informe o nome do HTML.";
        return;
    }

    if (!alteracao) {
        resultado.textContent = "❌ Descreva a alteração.";
        return;
    }

    resultado.textContent = "⏳ Editando HTML...\n";

    try {

        const response = await fetch("/api/script", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                ferramenta: ferramenta,
                args: [
                    html,
                    alteracao
                ]
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.erro || ("Erro HTTP " + response.status));
        }

        resultado.textContent =
            data.resultado ||
            JSON.stringify(data, null, 2);

    } catch (erro) {

        resultado.textContent =
            "❌ ERRO\n\n" + erro.message;

    }

}
document
    .getElementById("nomeFerramenta")
    ?.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            executarScriptDireto();
        }
    });
</script>

</body>
</html>

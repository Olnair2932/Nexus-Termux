<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: #ffffff;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
        }

        .formulario {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .whatsapp {
            display: flex;
            gap: 8px;
        }

        .codigo {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-weight: bold;
        }

        .whatsapp input {
            flex: 1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 7px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="formulario">

        <h1>Cadastro</h1>

        <form id="cadastroForm">

            <label for="nome">Nome</label>

            <input
                id="nome"
                type="text"
                placeholder="Digite seu nome"
                maxlength="120"
                required
            >

            <label for="whatsapp">WhatsApp</label>

            <div class="whatsapp">

                <div class="codigo">55</div>

                <input
                    id="whatsapp"
                    type="tel"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="DDD + número"
                    required
                >

            </div>

            <label for="endereco">Endereço</label>

            <input
                id="endereco"
                type="text"
                placeholder="Digite seu endereço"
                maxlength="200"
                required
            >

            <label for="cidade">Cidade</label>

            <input
                id="cidade"
                type="text"
                placeholder="Digite sua cidade"
                maxlength="100"
                required
            >

            <button id="btnSalvar" type="submit">
                Salvar cadastro
            </button>

            <div id="mensagem"></div>

        </form>

    </div>

</div>

<div id="admin-area" style="
    max-width:500px;
    margin:20px auto 40px;
    padding:20px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
">

    <button
        id="btnGoogle"
        type="button"
        style="
            width:100%;
            padding:14px;
            border:0;
            border-radius:7px;
            background:#4285f4;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        "
    >
        🔐 Acesso do administrador com Google
    </button>

    <div
        id="admin-mensagem"
        style="
            margin-top:15px;
            text-align:center;
            font-weight:bold;
        "
    ></div>

    <div id="admin-painel" style="display:none;">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:20px;
            margin-bottom:15px;
        ">

            <strong>Cadastros recebidos</strong>

            <button
                id="btnSair"
                type="button"
                style="
                    padding:8px 12px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    background:#fff;
                    cursor:pointer;
                "
            >
                Sair
            </button>

        </div>

        <div id="lista-cadastros"></div>

    </div>

</div>

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    serverTimestamp,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyB0Tr9Dsy-Pn8WSPUmxTsx5j2S8Sc4xIDg",

    authDomain:
        "finance-master-629d1.firebaseapp.com",

    databaseURL:
        "https://finance-master-629d1-default-rtdb.firebaseio.com",

    projectId:
        "finance-master-629d1",

    storageBucket:
        "finance-master-629d1.firebasestorage.app",

    messagingSenderId:
        "411976359484",

    appId:
        "1:411976359484:web:eeee1000da6c1335326d39"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const form =
    document.getElementById("cadastroForm");

const whatsapp =
    document.getElementById("whatsapp");

const mensagem =
    document.getElementById("mensagem");

const btnSalvar =
    document.getElementById("btnSalvar");


// =====================================================
// ÁREA ADMINISTRATIVA
// =====================================================

const ADMIN_EMAIL = "olnairpereira@gmail.com";

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const btnGoogle =
    document.getElementById("btnGoogle");

const btnSair =
    document.getElementById("btnSair");

const adminMensagem =
    document.getElementById("admin-mensagem");

const adminPainel =
    document.getElementById("admin-painel");

const listaCadastros =
    document.getElementById("lista-cadastros");


function mostrarMensagemAdmin(texto, cor) {

    adminMensagem.textContent = texto;

    adminMensagem.style.color = cor;

}


btnGoogle.addEventListener("click", async function() {

    btnGoogle.disabled = true;

    btnGoogle.textContent =
        "Entrando...";

    try {

        const resultado =
            await signInWithPopup(auth, provider);

        const usuario =
            resultado.user;

        if (usuario.email !== ADMIN_EMAIL) {

            await signOut(auth);

            mostrarMensagemAdmin(
                "Acesso não autorizado.",
                "red"
            );

            return;
        }

        mostrarMensagemAdmin(
            "Login realizado com sucesso.",
            "green"
        );

    } catch (erro) {

        console.error(
            "Erro no login Google:",
            erro
        );

        mostrarMensagemAdmin(
            "Não foi possível realizar o login.",
            "red"
        );

    } finally {

        btnGoogle.disabled = false;

        btnGoogle.textContent =
            "🔐 Acesso do administrador com Google";

    }

});


btnSair.addEventListener("click", async function() {

    try {

        await signOut(auth);

        adminPainel.style.display = "none";

        btnGoogle.style.display = "block";

        listaCadastros.innerHTML = "";

        mostrarMensagemAdmin(
            "Sessão encerrada.",
            "#555"
        );

    } catch (erro) {

        console.error(
            "Erro ao sair:",
            erro
        );

    }

});


onAuthStateChanged(auth, function(usuario) {

    if (!usuario) {

        adminPainel.style.display = "none";

        btnGoogle.style.display = "block";

        return;
    }


    if (usuario.email !== ADMIN_EMAIL) {

        adminPainel.style.display = "none";

        btnGoogle.style.display = "block";

        return;
    }


    btnGoogle.style.display = "none";

    adminPainel.style.display = "block";

    carregarCadastros();

});


function carregarCadastros() {

    const cadastrosRef =
        ref(db, "nexus/cadastros");


    onValue(
        cadastrosRef,
        function(snapshot) {

            listaCadastros.innerHTML = "";

            if (!snapshot.exists()) {

                listaCadastros.innerHTML =
                    "<p>Nenhum cadastro encontrado.</p>";

                return;
            }


            const dados =
                snapshot.val();

            const registros =
                Object.entries(dados).reverse();


            registros.forEach(
                function([id, cadastro]) {

                    const card =
                        document.createElement("div");

                    card.style.cssText = `
                        border:1px solid #ddd;
                        border-radius:8px;
                        padding:15px;
                        margin-bottom:10px;
                        background:#fafafa;
                    `;


                    const nome =
                        document.createElement("strong");

                    nome.textContent =
                        cadastro.nome || "Sem nome";


                    const info =
                        document.createElement("div");

                    info.style.marginTop = "8px";

                    info.innerHTML = `
                        WhatsApp:
                        <strong>${cadastro.whatsapp || ""}</strong><br>
                        Endereço:
                        ${cadastro.endereco || ""}<br>
                        Cidade:
                        ${cadastro.cidade || ""}
                    `;


                    card.appendChild(nome);

                    card.appendChild(info);

                    listaCadastros.appendChild(card);

                }
            );

        },
        function(erro) {

            console.error(
                "Erro ao carregar cadastros:",
                erro
            );

            listaCadastros.innerHTML =
                "<p style='color:red'>Erro ao carregar os cadastros.</p>";

        }
    );

}



whatsapp.addEventListener("input", function() {

    this.value =
        this.value
            .replace(/\D/g, "")
            .slice(0, 11);

});


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const nome =
        document.getElementById("nome")
            .value.trim();

    const numero =
        whatsapp.value
            .replace(/\D/g, "");

    const endereco =
        document.getElementById("endereco")
            .value.trim();

    const cidade =
        document.getElementById("cidade")
            .value.trim();


    if (!nome || !numero || !endereco || !cidade) {

        mensagem.textContent =
            "Preencha todos os campos.";

        mensagem.style.color = "red";

        return;
    }


    if (numero.length !== 10 &&
        numero.length !== 11) {

        mensagem.textContent =
            "Digite um WhatsApp válido com DDD.";

        mensagem.style.color = "red";

        return;
    }


    btnSalvar.disabled = true;

    btnSalvar.textContent =
        "Salvando...";

    mensagem.textContent = "";


    try {

        const cadastroRef =
            push(ref(db, "nexus/cadastros"));


        await set(cadastroRef, {

            nome: nome,

            whatsapp: "55" + numero,

            endereco: endereco,

            cidade: cidade,

            criadoEm: serverTimestamp()

        });


        mensagem.textContent =
            "Cadastro salvo com sucesso!";

        mensagem.style.color =
            "green";


        form.reset();


    } catch (erro) {

        console.error(
            "Erro ao salvar:",
            erro
        );


        mensagem.textContent =
            "Erro ao salvar o cadastro. Verifique as regras do Firebase.";

        mensagem.style.color =
            "red";


    } finally {

        btnSalvar.disabled = false;

        btnSalvar.textContent =
            "Salvar cadastro";

    }

});

</script>

</body>
</html>
